<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repositório - IEFP CRM</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../estilo/tokens.css">
<link rel="stylesheet" href="../estilo/componentes.css">
<style>
/* Só o que é do repositório. Tudo o resto vem de estilo/ - partilhado com a app.
   Se algo aqui em baixo servir também à app, o sítio certo é o componentes.css. */

/* a app usa <div> na navegação; aqui são <button> */
.nav-link{background:none;border:0;width:100%;text-align:left;font:inherit}
.profile .sair{margin-left:auto;flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;cursor:pointer}
.profile .sair:hover{background:rgba(255,255,255,.2)}
.profile .sair svg{width:16px;height:16px}
/* a app dimensiona os ícones da barra por atributo width no SVG; os daqui
   são escritos à mão sem esse atributo, por isso precisam de tamanho no CSS */
.nav-search svg{width:16px;height:16px;flex:none}
.turma-chip svg{width:14px;height:14px;flex:none}
.made-by svg{width:14px;height:14px;flex:none}
.app.nav-collapsed .turma-chip span{display:none}
.app.nav-collapsed .profile .sair{margin-left:0}
.grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
tr.clickable{cursor:pointer}
.tag{align-self:flex-start}   /* dentro de um flex column, senão estica */
td .tag{align-self:auto}
.hidden{display:none!important}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;overflow-x:auto}
  .nav{flex-direction:row}
  .nav-group,.nav-foot,.brand-txt,.nav-search{display:none}
  .nav-link.active::before{display:none}
}
/* MÓDULO */
.mod{display:flex;flex-direction:column;gap:11px;padding:20px}
.mod h3{font-size:1.02rem;font-weight:800}
.mod-links{display:flex;flex-direction:column;gap:5px;font-size:.84rem}
.mod-links a{display:flex;align-items:center;gap:7px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod-links a:hover{color:var(--g700)}
.mod-links svg{flex:none;width:16px;height:16px}
.mod-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:14px;border-top:1px solid var(--border);font-size:.82rem;color:var(--muted)}
.mod-foot .btn,.mod-foot .btn-sec{margin-left:auto}
.mod-foot .btn-sec+.btn{margin-left:0}

/* EDITOR DE TEXTO RICO (mesmo padrão do editor de assinaturas da app) */
.rt-toolbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:7px 8px;border:1px solid var(--border);border-bottom:0;border-radius:10px 10px 0 0;background:var(--surface2)}
.rt-tb{height:30px;min-width:30px;padding:0 8px;display:inline-grid;place-items:center;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);cursor:pointer;font-size:.92rem;font-weight:700}
.rt-tb:hover{border-color:var(--g400);background:var(--g50);color:var(--g700)}
.rt-tb svg{width:15px;height:15px}
.rt-sep{width:1px;height:20px;background:var(--border);margin:0 2px}
.rt-editor{min-height:130px;max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:0 0 10px 10px;padding:12px 14px;background:var(--surface2);color:var(--text);outline:none;font-size:.9rem}
.rt-editor:focus{border-color:var(--g400);box-shadow:0 0 0 3px rgba(0,166,81,.14);background:var(--surface)}
.rt-editor:empty:before{content:attr(data-placeholder);color:var(--muted2)}
.rt-editor p{margin:0 0 9px}
.rt-editor ul,.rt-editor ol{margin:0 0 9px 20px}
.rt-editor a{color:var(--g700);text-decoration:underline}

/* MARCADORES */
.vars{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.var-chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:700;background:var(--surface3);color:var(--muted);border:1px solid var(--border);cursor:pointer;font-family:ui-monospace,monospace}
.var-chip:hover{border-color:var(--g400);color:var(--g700);background:var(--g50)}

/* AVISO RGPD */
.nota-rgpd{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:.78rem;font-weight:600;line-height:1.45}
.nota-rgpd svg{flex:none;width:16px;height:16px;margin-top:1px}

/* SECÇÃO RECOLHÍVEL */
.fold{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.fold>summary{padding:11px 14px;background:var(--surface2);cursor:pointer;font-weight:700;font-size:.86rem;list-style:none;display:flex;align-items:center;gap:8px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted2);border-bottom:2px solid var(--muted2);transform:rotate(-45deg);transition:transform .18s;margin-left:2px}
.fold[open]>summary::before{transform:rotate(45deg)}
.fold>summary .sub{font-weight:500;color:var(--muted);font-size:.78rem;margin-left:auto}
.fold-body{padding:16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--border)}

/* PRÉ-VISUALIZAÇÃO DO EMAIL */
.preview{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface2)}
.preview-head{background:linear-gradient(135deg,var(--g800),var(--g600));color:#fff;padding:14px 18px;font-weight:800;font-size:.92rem}
.preview-body{padding:18px}
.preview-body .pv-title{font-weight:700;font-size:1rem;margin:0 0 10px}
.preview-body .pv-text{color:var(--muted);font-size:.88rem;min-height:40px}
.preview-body .pv-text p{margin:0 0 9px}
.preview-body .pv-text ul,.preview-body .pv-text ol{margin:0 0 9px 20px}
.preview-body .pv-text a{color:var(--g700);text-decoration:underline}
.preview-body .pv-saud{font-size:.88rem}
.pv-btn{display:inline-block;margin-top:16px;background:var(--g800);color:#fff;padding:10px 20px;border-radius:8px;font-weight:700;font-size:.85rem}

/* MATERIAIS (vista do formando) */
.mat-lista{display:flex;flex-direction:column;gap:14px;max-width:760px}
.mat{padding:20px;display:flex;flex-direction:column;gap:10px}
.mat-topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mat-topo .mat-data{margin-left:auto;font-size:.78rem}
.mat h3{font-size:1.05rem;font-weight:800}
.mat .pv-text{min-height:0}
.mat-foot{display:flex;align-items:center;gap:12px;margin-top:4px;flex-wrap:wrap}
.mat-novo{border-color:var(--g300);box-shadow:0 0 0 1px var(--g300),var(--shadow)}
.chip svg{width:14px;height:14px;flex:none}
button.chip{cursor:pointer;font:inherit}
button.chip:hover{border-color:var(--g400);color:var(--g700)}
</style>
</head>
<body>

<!-- ENTRADA -->
<div id="login">
  <div class="login-bg"></div>
  <div class="login-panel">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-logo"><img src="../IEFPnormal.png" alt="IEFP"></div>
        <div>
          <h1>IEFP CRM</h1>
          <p>Repositório de sessões</p>
        </div>
      </div>
      <h2 class="login-h">Entrar</h2>
      <p class="login-sub">Os materiais das sessões, num só sítio.</p>
      <form id="loginForm">
        <div class="field"><label for="fTurma">Turma</label>
          <input id="fTurma" inputmode="numeric" autocomplete="off" placeholder="12023483" required></div>
        <div class="field"><label for="fUser">Utilizador</label>
          <input id="fUser" autocomplete="username" required></div>
        <div class="field"><label for="fPass">Palavra-passe</label>
          <input id="fPass" type="password" autocomplete="current-password" required></div>
        <button class="btn login-btn" id="btnLogin">Entrar</button>
        <p class="login-err" id="loginErr"></p>
      </form>
      <p class="login-credit">Formadores e formandos entram com a conta da app IEFP CRM.</p>
    </div>
  </div>
</div>

<!-- APP -->
<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><img src="../IEFPnormal.png" alt="IEFP"></div>
      <div class="brand-txt"><h1>IEFP CRM</h1><p>Repositório de sessões</p></div>
    </div>
    <div class="nav-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="pesquisa" type="search" placeholder="Pesquisar…" autocomplete="off" aria-label="Pesquisar">
    </div>
    <nav class="nav">
      <div class="nav-group" id="navGrupo">Gestão</div>
      <button class="nav-link" data-view="materiais"></button>
      <button class="nav-link active" data-view="modulos"></button>
      <button class="nav-link" data-view="publicacoes"></button>
      <button class="nav-link" data-view="turma"></button>
    </nav>
    <div class="nav-foot">
      <div class="profile">
        <div class="avatar" id="avatar"></div>
        <div class="profile-txt"><strong id="profNome"></strong><span id="profPapel"></span></div>
        <button class="sair" id="btnSair" title="Sair">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
      <div class="turma-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 19v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/></svg>
        <span>Turma: <span id="brandTurma"></span></span>
      </div>
      <a class="made-by" href="../">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Voltar à app IEFP CRM</span>
      </a>
      <a class="legal-link" href="https://iefpcrm.cr0x.org/manual/aviso-legal/" target="_blank" rel="noopener">Aviso legal</a>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div class="header-l">
        <button class="icon-btn" id="btnRecolher" title="Recolher menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 3v18M3 3h18v18H3z"/></svg>
        </button>
        <div>
          <h2 id="hTitulo">Módulos</h2>
          <div class="breadcrumb" id="hSub"></div>
        </div>
      </div>
      <div class="header-r">
        <button class="icon-btn" id="btnTema" title="Tema claro/escuro"></button>
        <button class="btn hidden" id="btnNovoModulo"></button>
      </div>
    </header>
    <div class="content">
      <section class="view" id="vMateriais"></section>
      <section class="view active" id="vModulos"></section>
      <section class="view" id="vPublicacoes"></section>
      <section class="view" id="vTurma"></section>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
'use strict';
const SUPA_URL='https://qgfzbyhfyqvmmmdiqycu.supabase.co';
const SUPA_KEY='sb_publishable_atlEEoeN4-CWY8mD7KQNsw_m1cXjdIE';
const CHAVE='iefp-repo-sessao', TEMA='iefp-repo-tema';

/* Ícones monocromáticos (currentColor), no espírito do conjunto da app. */
const I={
  pasta:'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  mail:'M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l9 6 9-6',
  gente:'M16 19v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6M21 19v-2a4 4 0 0 0-3-3.9',
  link:'M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1',
  mais:'M12 5v14M5 12h14',
  lapis:'M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16zM14 6l4 4',
  lixo:'M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13',
  olho:'M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6',
  lista:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
  sol:'M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',
  lua:'M21 13a8 8 0 1 1-10-10 6 6 0 0 0 10 10',
  ok:'M20 6 9 17l-5-5',
  alerta:'M12 9v4m0 4h.01M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0'
};
const ic=(n,c='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="${c}"><path d="${I[n]}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const dt=s=>s?new Date(s).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';

let sessao=null, modulos=[], publicacoes=[];

/* ---------- Tema ---------- */
function aplicarTema(t){
  document.documentElement.dataset.theme=t;
  localStorage.setItem(TEMA,t);
  $('#btnTema').innerHTML=ic(t==='dark'?'sol':'lua');
}
$('#btnTema').addEventListener('click',()=>
  aplicarTema(document.documentElement.dataset.theme==='dark'?'light':'dark'));

/* ---------- Supabase ---------- */
async function rpc(nome,args){
  const r=await fetch(`${SUPA_URL}/rest/v1/rpc/${nome}`,{
    method:'POST',
    headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(args||{})
  });
  const d=await r.json().catch(()=>null);
  if(!r.ok){
    const bruto=(d&&(d.message||d.hint))||'ERRO';
    const m=bruto.match(/SESSAO_INVALIDA|SEM_PERMISSAO|NAO_ENCONTRADO|DADOS_EM_FALTA|CREDENCIAIS_INVALIDAS|TURMA_NAO_EXISTE|JA_ENVIADA/);
    throw new Error(m?m[0]:bruto);
  }
  return d;
}
async function edge(nome,body){
  const r=await fetch(`${SUPA_URL}/functions/v1/${nome}`,{
    method:'POST',
    headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  return r.json().catch(()=>({ok:false,erro:'RESPOSTA_INVALIDA'}));
}
const ERROS={
  SESSAO_INVALIDA:'A sessão expirou. Entra outra vez.',
  SEM_PERMISSAO:'Só os formadores podem gerir o repositório.',
  CREDENCIAIS_INVALIDAS:'Utilizador ou palavra-passe errados.',
  TURMA_NAO_EXISTE:'Essa turma não existe.',
  DADOS_EM_FALTA:'Falta preencher campos obrigatórios.',
  NAO_ENCONTRADO:'Já não existe.',
  JA_ENVIADA:'Esta publicação já foi enviada - já não se edita.',
  SEM_RESEND:'O envio de email não está configurado no servidor.'
};
function toast(msg,tipo){
  const t=document.createElement('div');
  t.className='toast'+(tipo?' '+tipo:'');
  t.innerHTML=`${ic(tipo==='err'||tipo==='warn'?'alerta':'ok')}<div><strong>${esc(ERROS[msg]||msg)}</strong></div>`;
  $('#toasts').appendChild(t);
  setTimeout(()=>t.remove(),4600);
}
function tratar(e){
  const m=e&&e.message||String(e);
  toast(m,'err');
  if(m==='SESSAO_INVALIDA') sair();
}

/* ---------- Entrada ---------- */
$('#loginForm').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const b=$('#btnLogin'); b.disabled=true; b.textContent='A entrar...'; $('#loginErr').textContent='';
  try{
    const d=await rpc('login',{
      p_codigo:$('#fTurma').value.trim(),
      p_username:$('#fUser').value.trim(),
      p_password:$('#fPass').value
    });
    sessao={token:d.token,user:d.user,turma:$('#fTurma').value.trim()};
    localStorage.setItem(CHAVE,JSON.stringify(sessao));
    await arrancar();
  }catch(e){
    const m=e&&e.message||String(e);
    $('#loginErr').textContent=ERROS[m]||m;
  }
  b.disabled=false; b.textContent='Entrar';
});
function sair(){
  if(sessao) rpc('logout',{p_token:sessao.token}).catch(()=>{});
  sessao=null; localStorage.removeItem(CHAVE);
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#fPass').value='';
}
$('#btnSair').addEventListener('click',sair);

/* ---------- Navegação ---------- */
const ehFormador=()=>!!sessao&&(sessao.user.papel==='Formador'||sessao.user.papel==='Administrador');
const VISTAS={
  materiais:{icone:'pasta',rotulo:'Materiais',titulo:'Materiais',sub:'O que o formador já publicou para a tua turma'},
  modulos:{icone:'pasta',rotulo:'Módulos',titulo:'Módulos',sub:'Uma pasta do Drive por UFCD'},
  publicacoes:{icone:'mail',rotulo:'Publicações',titulo:'Publicações',sub:'Rascunhos, envios e quem abriu o quê'},
  turma:{icone:'gente',rotulo:'Turma',titulo:'Turma',sub:'Quem anda a acompanhar e quem não'}
};
document.querySelectorAll('.nav-link').forEach(b=>{
  const v=VISTAS[b.dataset.view];
  b.innerHTML=`${ic(v.icone)}<span class="lbl">${v.rotulo}</span>`;
  b.addEventListener('click',()=>mostrar(b.dataset.view));
});
function mostrar(v){
  document.querySelectorAll('.nav-link').forEach(x=>x.classList.toggle('active',x.dataset.view===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='v'+v[0].toUpperCase()+v.slice(1)));
  $('#hTitulo').textContent=VISTAS[v].titulo;
  $('#hSub').textContent=VISTAS[v].sub;
  $('#btnNovoModulo').classList.toggle('hidden',v!=='modulos'||!ehFormador());
  if(v==='modulos') carregarModulos().then(filtrar);
  else if(v==='publicacoes') carregarPublicacoes().then(filtrar);
  else if(v==='turma') carregarTurma().then(filtrar);
  else if(v==='materiais') carregarMateriais().then(filtrar);
}
$('#btnRecolher').addEventListener('click',()=>$('#app').classList.toggle('nav-collapsed'));

/* Pesquisa: filtra o que está à vista (cartões de módulo ou linhas de tabela). */
function filtrar(){
  const q=($('#pesquisa').value||'').trim().toLowerCase();
  const vista=document.querySelector('.view.active');
  if(!vista) return;
  vista.querySelectorAll('.mod, .mat, tbody tr').forEach(el=>{
    el.style.display=(!q||el.textContent.toLowerCase().includes(q))?'':'none';
  });
}
$('#pesquisa').addEventListener('input',filtrar);

async function arrancar(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  const u=sessao.user, formador=ehFormador();
  $('#brandTurma').textContent=sessao.turma;
  $('#profNome').textContent=`${u.nome} ${u.apelido||''}`.trim();
  $('#profPapel').textContent=u.papel;
  $('#avatar').textContent=((u.nome||'?')[0]+((u.apelido||' ')[0]||'')).toUpperCase();
  $('#btnNovoModulo').innerHTML=ic('mais')+'Novo módulo';
  $('#pesquisa').value='';
  // cada papel vê a sua navegação: formador gere, formando consulta
  $('#navGrupo').textContent=formador?'Gestão':'A minha turma';
  document.querySelectorAll('.nav-link').forEach(b=>{
    b.classList.toggle('hidden', formador ? b.dataset.view==='materiais'
                                          : b.dataset.view!=='materiais');
  });
  mostrar(formador?'modulos':'materiais');
}
$('#btnNovoModulo').addEventListener('click',()=>modalModulo(null));

/* ---------- Módulos ---------- */
async function carregarModulos(){
  try{ modulos=await rpc('repo_modulos_listar',{p_token:sessao.token}); }
  catch(e){ return tratar(e); }

  $('#vModulos').innerHTML = !modulos.length
    ? `<div class="empty">${ic('pasta')}<strong>Ainda não há módulos</strong>
        <span>Cria um por cada UFCD, com a pasta do Drive dos materiais.</span></div>`
    : `<div class="grid">${modulos.map(m=>`
        <article class="card mod">
          <span class="tag">UFCD ${esc(m.ufcd)}</span>
          <h3>${esc(m.nome)||'<span class="muted">Sem nome</span>'}</h3>
          <div class="mod-links">
            ${m.drive_url?`<a href="${esc(m.drive_url)}" target="_blank" rel="noopener">${ic('pasta')}Pasta do Drive</a>`:''}
            ${m.bitly_url?`<a href="${esc(m.bitly_url)}" target="_blank" rel="noopener">${ic('link')}${esc(m.bitly_url.replace(/^https?:\/\//,''))}</a>`:''}
          </div>
          <div class="mod-foot">

function abrirModal(html){
  // .modal-back do CSS partilhado é display:none por omissão; a classe .open
  // é que o mostra. Sem ela, o modal abre invisível (parece que nada acontece).
  const f=document.createElement('div'); f.className='modal-back open'; f.innerHTML=html;
  f.addEventListener('click',e=>{ if(e.target===f) f.remove(); });
  document.addEventListener('keydown',function esc(e){
    if(e.key==='Escape'){ f.remove(); document.removeEventListener('keydown',esc); }
  });
  document.body.appendChild(f);
  f.querySelectorAll('[data-fechar]').forEach(b=>b.addEventListener('click',()=>f.remove()));
  return f;
}

/* Confirmação no design system, em vez do popup do browser. */
function uiConfirm({titulo='Confirmar',texto='',ok='Confirmar',perigo=false}){
  return new Promise(res=>{
    const f=abrirModal(`<div class="modal" style="width:min(460px,100%)">
      <div class="modal-head"><div><h3>${esc(titulo)}</h3></div></div>
      <div class="modal-body"><div style="font-size:.92rem">${texto}</div></div>
      <div class="modal-foot"><span></span>
        <div style="display:flex;gap:10px">
          <button class="btn-sec" data-nao>Cancelar</button>
          <button class="${perigo?'btn-danger':'btn'}" data-sim>${esc(ok)}</button>
        </div></div></div>`);
    const fecha=v=>{ f.remove(); res(v); };
    f.querySelector('[data-sim]').addEventListener('click',()=>fecha(true));
    f.querySelector('[data-nao]').addEventListener('click',()=>fecha(false));
    // fechar por Escape/fundo (o abrirModal remove o elemento) conta como "não"
    const obs=new MutationObserver(()=>{ if(!document.body.contains(f)){ obs.disconnect(); res(false); } });
    obs.observe(document.body,{childList:true});
  });
}

    e.preventDefault();
    const u=prompt('Endereço da ligação:','https://');

    x.focus(); sinc();
  });
  /* colar sempre como texto simples, para não trazer lixo do Word */
  x.addEventListener('paste',e=>{

  });

    q(s).addEventListener('input',sinc));
  x.addEventListener('input',sinc);

      p_assunto:q('#pAssunto').value.trim(), p_cabecalho:q('#pCabecalho').value.trim(),
      p_saudacao:q('#pSaudacao').value.trim(), p_botao:q('#pBotao').value.trim(),
      p_rodape:q('#pRodape').value.trim()
    };
    try{
      if(pub){
        await rpc('repo_publicacao_editar',{...campos,p_id:pub.id});
        f.remove(); carregarPublicacoes();
        confirmarEnvio(pub.id, pub.destinatarios, 0);
      }else{
        const p=await rpc('repo_publicar',{...campos,p_modulo_id:m.id});
        f.remove(); carregarModulos();
        if(!p.destinatarios) return toast('Guardado, mas nenhum formando desta turma tem email preenchido.','warn');
        confirmarEnvio(p.id, p.destinatarios, p.sem_email);
      }
    }catch(err){
      tratar(err); b.disabled=false; b.innerHTML=ic('ok')+(pub?'Guardar alterações':'Guardar rascunho');
    }
  });
}

/* Enviar é sempre um ato deliberado: diálogo próprio, com o número real. */
async function confirmarEnvio(pubId, dest, sem){
  const ok=await uiConfirm({
    titulo:'Enviar o aviso agora?',
    ok:'Enviar agora',
    texto:`O email vai para <strong>${dest} formando(s)</strong> da turma ${esc(sessao.turma)}.`
      +(sem?`<br>${sem} sem email ficam de fora (veem na mesma na página da turma).`:'')
      +`<br><br><span class="hint">Se preferires, fica guardado como rascunho - editas e envias depois, em Publicações.</span>`
  });
  if(!ok){ toast('Ficou em rascunho. Editas e envias quando quiseres, em Publicações.','warn'); return; }
  const r=await edge('repo-enviar',{token:sessao.token,publicacao_id:pubId});
  carregarPublicacoes();
  if(!r.ok) return toast(r.erro||'O envio falhou. A publicação ficou guardada.','err');
  if(r.falhados) return toast(`Enviado a ${r.enviados}, falhou em ${r.falhados}. Abre a publicação para reenviar.`,'warn');
  if(!r.enviados) return toast('Nada por enviar - já estavam todos avisados.','warn');
  toast(`Enviado a ${r.enviados} formando(s).`);
}

/* ---------- Publicações ---------- */
async function carregarPublicacoes(){
  try{ publicacoes=await rpc('repo_publicacoes_listar',{p_token:sessao.token,p_modulo:null}); }
  catch(e){ return tratar(e); }

  const estado=p=>{
    if(!p.enviado_em) return '<span class="pill amber">Rascunho</span>';
    if((p.enviados||0)<(p.destinatarios||0)) return `<span class="pill amber">Parcial · ${p.enviados}/${p.destinatarios}</span>`;
    return `<span class="pill grey">Enviada · ${dt(p.enviado_em)}</span>`;
  };
  $('#vPublicacoes').innerHTML = !publicacoes.length
    ? `<div class="empty">${ic('mail')}<strong>Ainda não publicaste nada</strong>
        <span>Vai a Módulos e carrega em "Nova publicação".</span></div>`
    : `<div class="table-wrap"><table><thead><tr>
        <th>Publicação</th><th>UFCD</th><th>Estado</th><th>Abriram</th><th></th>
      </tr></thead><tbody>${publicacoes.map(p=>{
        const pct=p.destinatarios?Math.round(p.abriram/p.destinatarios*100):0;
        const cor=!p.abriram?'grey':pct>=70?'green':'amber';
        return `<tr class="clickable" data-ver="${p.id}">
          <td><div class="cell-main">${esc(p.titulo)}</div>
              <div class="cell-sub">${p.criado_em?dt(p.criado_em):''}</div></td>
          <td><span class="tag">${esc(p.ufcd)}</span></td>
          <td>${estado(p)}</td>
          <td>${p.enviado_em?`<span class="pill ${cor}">${p.abriram}/${p.destinatarios} · ${pct}%</span>`:'<span class="muted">-</span>'}</td>
          <td class="t-right muted">${p.enviado_em?ic('olho'):ic('lapis')}</td>
        </tr>`;}).join('')}</tbody></table></div>`;

  document.querySelectorAll('[data-ver]').forEach(r=>r.addEventListener('click',()=>{
    const p=publicacoes.find(x=>x.id===r.dataset.ver);
    // rascunho volta ao editor; enviada abre o estado de leitura
    if(!p.enviado_em) modalPublicar(modulos.find(x=>x.id===p.modulo_id)||null,p);
    else modalEstado(p);
  }));
}

async function modalEstado(p){

  catch(e){ return tratar(e); }

  const pendentes=linhas.filter(l=>!l.enviado_em&&l.email).length;

  const emailLinha=l=>{
    if(!l.email) return '<span class="muted">sem email - vê na página da turma</span>';
    const e2=l.email2&&l.email2!==l.email?` · ${esc(l.email2)} <span class="muted">(IEFP)</span>`:'';
    return `${esc(l.email)}${e2}`;

  const f=abrirModal(`<div class="modal wide">
    <div class="modal-head">
      <div><h3>${esc(p.titulo)}</h3>

          <td>${l.erro?`<span class="pill red" title="${esc(l.erro)}">falhou</span>`
               :l.enviado_em?'<span class="pill grey">enviado</span>'
               :l.email?'<span class="pill amber">por enviar</span>'
               :'<span class="pill grey">só página</span>'}</td>
          <td>${l.primeiro_clique?`<span class="pill green">${dt(l.primeiro_clique)}</span>`
               :'<span class="muted">ainda não</span>'}</td>
          <td class="t-right">${l.cliques||''}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>

      <button class="btn-danger btn-sm" id="ePagar">${ic('lixo')}Apagar</button>

        ${pendentes>0?`<button class="btn" id="eEnviar">${ic('mail')}Enviar ${pendentes} pendente(s)</button>`
          :naoAbriram>0?`<button class="btn" id="eReenviar">${ic('mail')}Reenviar a quem não abriu (${naoAbriram})</button>`
          :'<button class="btn-sec" data-fechar>Fechar</button>'}
      </div>
    </div></div>`);

  f.querySelector('#eVer').addEventListener('click',()=>modalEmailEnviado(p));

    b.disabled=true; b.textContent='A enviar...';

    f.remove(); carregarPublicacoes();
    if(!r.ok) return toast(r.erro||'O envio falhou.','err');
    if(r.falhados) return toast(`Enviado a ${r.enviados}, falhou em ${r.falhados}.`,'warn');
    toast(`Enviado a ${r.enviados} formando(s).`);
  });

  f.querySelector('#eReenviar')?.addEventListener('click',async e=>{
    const b=e.currentTarget;
    const ok=await uiConfirm({titulo:'Reenviar o aviso?',ok:'Reenviar agora',

    try{
      await rpc('repo_reabrir_nao_abriram',{p_token:sessao.token,p_publicacao:p.id});

    .replace(/\{turma\}/g,esc(sessao.turma));
  abrirModal(`<div class="modal">
    <div class="modal-head"><div><h3>Email enviado</h3>
      <div class="sub">Assunto: ${subst(p.assunto)}</div></div></div>
    <div class="modal-body">
      <div class="preview">
        <div class="preview-head">${subst(p.cabecalho)}</div>
        <div class="preview-body">
          <p class="pv-saud" style="margin:0 0 10px">${subst(p.saudacao)}</p>
          <p class="pv-title">${esc(p.titulo)}</p>
          <div class="pv-text">${p.texto||'<span class="muted">(sem mensagem)</span>'}</div>
          <span class="pv-btn">${esc(p.botao)||'Aceder ao material'}</span>
          <p class="hint" style="margin-top:14px">${subst(p.rodape)}</p>
        </div>
      </div>
    </div>
    <div class="modal-foot"><span></span>
      <button class="btn" data-fechar>Fechar</button></div>
  </div>`);
}

/* ---------- Turma ---------- */
async function carregarTurma(){
  let linhas=[];
  try{ linhas=await rpc('repo_resumo_turma',{p_token:sessao.token}); }
  catch(e){ return tratar(e); }

  $('#vTurma').innerHTML = !linhas.length
    ? `<div class="empty">${ic('gente')}<strong>Esta turma ainda não tem formandos</strong>
        <span>Adiciona-os na app IEFP CRM e aparecem aqui.</span></div>`
    : `<div class="card card-pad">
        <div class="section-head" style="margin-bottom:16px">
          <div><h3>Turma ${esc(sessao.turma)}</h3>
            <div class="sub">Ordenada pelos que estão há mais tempo sem abrir nada. É por aqui que começas a conversa.</div></div>
          <button class="chip" id="linkTurma" title="Copiar o link da turma">${ic('link')} iefpcrm.cr0x.org/repo</button>
        </div>
        <div class="table-wrap"><table><thead><tr>
          <th>Formando</th><th>Abriu</th><th>Último acesso</th>
        </tr></thead><tbody>${linhas.map(l=>{
          const pct=l.recebidas?Math.round(l.abertas/l.recebidas*100):0;
          const frio=l.recebidas&&!l.abertas;
          return `<tr>
            <td><div class="cell-main">${esc(l.nome)}</div>
                <div class="cell-sub">${esc(l.email)||'sem email'}</div></td>
            <td><span class="pill ${frio?'red':l.abertas?'green':'grey'}">${l.abertas}/${l.recebidas} · ${pct}%</span></td>
            <td class="muted">${l.ultimo_acesso?dt(l.ultimo_acesso):'nunca'}</td>
          </tr>`;}).join('')}</tbody></table></div>
      </div>`;

  $('#linkTurma')?.addEventListener('click',()=>{
    navigator.clipboard?.writeText('https://iefpcrm.cr0x.org/repo/');
    toast('Link copiado. É o mesmo o ano inteiro: os formandos entram com a conta da app IEFP CRM.');
  });
}

/* ---------- Materiais (a vista do formando) ---------- */
async function carregarMateriais(){
  let itens=[];
  try{ itens=await rpc('repo_meus_materiais',{p_token:sessao.token}); }
  catch(e){ return tratar(e); }

  $('#vMateriais').innerHTML = !itens.length
    ? `<div class="empty">${ic('pasta')}<strong>Ainda não há materiais</strong>
        <span>Quando o formador publicar algo para a turma, aparece aqui.</span></div>`
    : `<div class="mat-lista">${itens.map(i=>`
        <article class="card mat ${i.aberto_em?'':'mat-novo'}">
          <div class="mat-topo">
            <span class="tag">UFCD ${esc(i.ufcd)}</span>
            ${i.aberto_em?'':'<span class="pill green">Novo</span>'}
            <span class="mat-data muted">${dt(i.publicado_em)}</span>
          </div>
          <h3>${esc(i.titulo)}</h3>
          <div class="pv-text">${i.texto||''}</div>
          <div class="mat-foot">
            <a class="btn" href="${SUPA_URL}/functions/v1/r?t=${i.envio_token}" target="_blank" rel="noopener" data-mat>${ic('link')}${esc(i.botao||'Aceder ao material')}</a>
            ${i.aberto_em?`<span class="hint">Abriste a ${dt(i.aberto_em)}</span>`:''}
          </div>
        </article>`).join('')}</div>`;

  // o clique regista no servidor; refrescar tira o selo "Novo"
  document.querySelectorAll('[data-mat]').forEach(a=>a.addEventListener('click',
    ()=>setTimeout(carregarMateriais,1500)));
}

/* ---------- Arranque ---------- */
aplicarTema(localStorage.getItem(TEMA)||
  (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
try{ sessao=JSON.parse(localStorage.getItem(CHAVE)||'null'); }catch(e){}
if(sessao&&sessao.token) arrancar().catch(sair);
</script>
